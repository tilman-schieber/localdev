<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>localdev</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #f7f7f5; --card: #fff; --fg: #1b1b1a; --mute: #6b6b68; --line: #e5e4e0;
  --accent: #2f6fdb; --ok: #1f9d55; --warn: #d08a00; --bad: #d64545; --off: #a3a3a0;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #111110; --card: #1a1a19; --fg: #ececea; --mute: #9a9a96; --line: #2b2b29;
          --accent: #6b9cf0; --off: #5c5c59; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
.wrap { max-width: 1040px; margin: 0 auto; padding: 28px 16px 64px; }
header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
h1 { font-size: 20px; margin: 0; letter-spacing: -0.01em; }
h1 span { color: var(--mute); font-weight: 400; font-size: 13px; margin-left: 8px; }
h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--mute); margin: 32px 0 10px; display: flex; align-items: center; gap: 10px; }
.meta { color: var(--mute); font-size: 12px; font-family: var(--mono); }
.list { background: var(--card); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; padding: 12px 16px; border-top: 1px solid var(--line); align-items: center; }
.row:first-child { border-top: 0; }
.title { display: flex; align-items: center; gap: 10px; min-width: 0; flex-wrap: wrap; }
.title a.name { font-weight: 600; color: var(--fg); text-decoration: none; }
.title a.name:hover { color: var(--accent); }
.url { font-family: var(--mono); font-size: 12px; color: var(--accent); text-decoration: none; }
.url:hover { text-decoration: underline; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--off); flex: none; }
.dot.running { background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 20%, transparent); }
.dot.starting { background: var(--warn); animation: pulse 1s ease-in-out infinite; }
.dot.exited, .dot.down { background: var(--bad); }
@keyframes pulse { 50% { opacity: .35; } }
.badge { font-size: 11px; padding: 1px 7px; border-radius: 99px; border: 1px solid var(--line); color: var(--mute); }
.badge.stale { border-color: var(--warn); color: var(--warn); }
.sub { color: var(--mute); font-family: var(--mono); font-size: 12px; margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.actions { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
button { font: inherit; font-size: 12px; padding: 4px 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--card); color: var(--fg); cursor: pointer; }
button:hover { border-color: var(--mute); }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button.danger:hover { border-color: var(--bad); color: var(--bad); }
button:disabled { opacity: .5; cursor: default; }
.empty { padding: 24px 16px; color: var(--mute); }
pre, code { font-family: var(--mono); font-size: 12px; }
.empty pre { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; margin: 10px 0 0; overflow-x: auto; color: var(--fg); }
dialog { width: min(920px, calc(100vw - 32px)); border: 1px solid var(--line); border-radius: 10px; background: var(--card); color: var(--fg); padding: 0; }
dialog::backdrop { background: rgb(0 0 0 / .45); }
.dlg-head { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--line); gap: 8px; }
#logbody { margin: 0; padding: 12px 14px; height: min(65vh, 600px); overflow: auto; white-space: pre-wrap; word-break: break-all; background: var(--bg); }
.err { color: var(--bad); font-size: 12px; margin-left: auto; }
@media (max-width: 640px) { .row { grid-template-columns: 1fr; } .actions { justify-content: flex-start; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>localdev <span id="ver"></span></h1>
    <div class="meta" id="daemon"></div>
  </header>

  <div class="list" id="apps"><div class="empty">Loading…</div></div>

  <h2>Unregistered services <button id="scan">Scan now</button><span class="err" id="scanmsg"></span></h2>
  <div class="list" id="found"><div class="empty">Discovery is off. Press “Scan now” for a one-time scan, or start the daemon with <code>--discover</code>.</div></div>
</div>

<dialog id="logs">
  <div class="dlg-head"><strong id="logtitle"></strong><button id="logclose">Close</button></div>
  <pre id="logbody"></pre>
</dialog>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
let info = null, logApp = null, scanned = null;

async function api(method, path, body) {
  const res = await fetch(path, {
    method,
    headers: { "X-Localdev": "dashboard", ...(body ? { "Content-Type": "application/json" } : {}) },
    body: body ? JSON.stringify(body) : undefined,
  });
  const ct = res.headers.get("content-type") || "";
  const data = ct.includes("json") ? await res.json() : await res.text();
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

function appRow(a) {
  const managed = a.managed;
  const alive = a.status === "running" || a.status === "starting";
  const sub = managed ? `$ ${a.command}` : `proxy only → port ${a.port}`;
  const btns = [];
  if (managed) {
    if (alive) btns.push(`<button data-act="restart">Restart</button><button data-act="stop">Stop</button>`);
    else btns.push(`<button class="primary" data-act="start">Start</button>`);
    btns.push(`<button data-act="logs">Logs</button>`);
  }
  btns.push(`<button class="danger" data-act="remove">Remove</button>`);
  const stale = a.stale ? `<span class="badge stale" title="Definition changed since start; restart to apply">stale</span>` : "";
  const exit = a.status === "exited" ? ` (code ${esc(a.exit_code)})` : "";
  return `<div class="row" data-name="${esc(a.name)}">
    <div>
      <div class="title"><span class="dot ${esc(a.status)}" title="${esc(a.status)}"></span>
        <a class="name" href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.name)}</a>
        <a class="url" href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.url)}</a>
        <span class="badge">${esc(a.status)}${exit}</span><span class="badge">:${esc(a.port)}</span>${stale}</div>
      <div class="sub" title="${esc(sub)}">${esc(sub)}</div>
      ${a.cwd ? `<div class="sub" title="${esc(a.cwd)}">${esc(a.cwd)}</div>` : ""}
    </div>
    <div class="actions">${btns.join("")}</div>
  </div>`;
}

function renderApps(apps) {
  const el = $("#apps");
  if (!apps.length) {
    el.innerHTML = `<div class="empty">No apps registered yet. From a project directory:
<pre>localdev run myapp -- npm run dev      # managed: localdev starts it and sets $PORT
localdev register myapp --port 3000    # proxy to a server you run yourself</pre></div>`;
    return;
  }
  el.innerHTML = apps.map(appRow).join("");
}

function renderFound(list) {
  const el = $("#found");
  const items = list.filter((l) => l.http && !l.registered_as);
  if (!items.length) { el.innerHTML = `<div class="empty">No unregistered HTTP services found.</div>`; return; }
  el.innerHTML = items.map((l) => `<div class="row" data-port="${l.port}" data-suggest="${esc(suggest(l))}">
    <div><div class="title"><span class="dot running"></span><a class="name" href="http://localhost:${l.port}" target="_blank" rel="noopener">:${l.port}</a>
      <span class="badge">${esc(l.process || "unknown process")}</span>${l.pid ? `<span class="badge">pid ${l.pid}</span>` : ""}</div>
      ${l.cwd ? `<div class="sub">${esc(l.cwd)}</div>` : ""}${l.command ? `<div class="sub" title="${esc(l.command)}">${esc(l.command)}</div>` : ""}</div>
    <div class="actions"><button class="primary" data-act="adopt">Register</button></div></div>`).join("");
}

function suggest(l) {
  const base = (l.cwd || "").split("/").filter(Boolean).pop() || l.process || "app";
  return base.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 63) || "app";
}

async function refresh() {
  try {
    if (!info) {
      info = await api("GET", "/api/health");
      $("#ver").textContent = "v" + info.version;
      $("#daemon").textContent = `${info.url} · pid ${info.pid}`;
    }
    renderApps(await api("GET", "/api/apps"));
    if (info.discover) renderFound(await api("GET", "/api/discover?cached=1"));
    else if (scanned) renderFound(scanned);
  } catch (e) {
    $("#apps").innerHTML = `<div class="empty">Cannot reach the localdev daemon: ${esc(e.message)}</div>`;
    info = null;
  }
}

$("#apps").addEventListener("click", async (ev) => {
  const btn = ev.target.closest("button[data-act]");
  if (!btn) return;
  const name = btn.closest(".row").dataset.name;
  const act = btn.dataset.act;
  if (act === "logs") return openLogs(name);
  if (act === "remove" && !confirm(`Unregister ${name}?`)) return;
  btn.disabled = true;
  try {
    if (act === "remove") await api("DELETE", `/api/apps/${name}`);
    else await api("POST", `/api/apps/${name}/${act}`);
  } catch (e) { alert(e.message); }
  refresh();
});

$("#found").addEventListener("click", async (ev) => {
  const btn = ev.target.closest("button[data-act=adopt]");
  if (!btn) return;
  const row = btn.closest(".row");
  const name = prompt(`Name for the app on port ${row.dataset.port}:`, row.dataset.suggest);
  if (!name) return;
  try {
    await api("PUT", `/api/apps/${encodeURIComponent(name)}`, { port: Number(row.dataset.port) });
    scanned = scanned && scanned.map((l) => l.port == row.dataset.port ? { ...l, registered_as: name } : l);
  } catch (e) { alert(e.message); }
  refresh();
});

$("#scan").addEventListener("click", async () => {
  $("#scan").disabled = true; $("#scanmsg").textContent = "";
  try { scanned = await api("GET", "/api/discover"); renderFound(scanned); }
  catch (e) { $("#scanmsg").textContent = e.message; }
  $("#scan").disabled = false;
});

async function loadLogs() {
  if (!logApp) return;
  const body = $("#logbody");
  const atBottom = body.scrollHeight - body.scrollTop - body.clientHeight < 40;
  try { body.textContent = await api("GET", `/api/apps/${logApp}/logs?tail=500`) || "(no output yet)"; }
  catch (e) { body.textContent = e.message; }
  if (atBottom) body.scrollTop = body.scrollHeight;
}
function openLogs(name) {
  logApp = name;
  $("#logtitle").textContent = `${name} — output`;
  $("#logbody").textContent = "";
  $("#logs").showModal();
  loadLogs().then(() => { $("#logbody").scrollTop = $("#logbody").scrollHeight; });
}
$("#logclose").addEventListener("click", () => $("#logs").close());
$("#logs").addEventListener("close", () => { logApp = null; });

refresh();
setInterval(refresh, 2000);
setInterval(loadLogs, 1500);
</script>
</body>
</html>

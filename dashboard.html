<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>localdev</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #f7f7f5; --card: #fff; --fg: #1b1b1a; --mute: #6b6b68; --line: #e5e4e0;
  --accent: #2f6fdb; --ok: #1f9d55; --warn: #d08a00; --bad: #d64545; --off: #a3a3a0;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #111110; --card: #1a1a19; --fg: #ececea; --mute: #9a9a96; --line: #2b2b29;
          --accent: #6b9cf0; --off: #5c5c59; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
.wrap { max-width: 1040px; margin: 0 auto; padding: 28px 16px 64px; }
header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
h1 { font-size: 20px; margin: 0; letter-spacing: -0.01em; }
h1 span { color: var(--mute); font-weight: 400; font-size: 13px; margin-left: 8px; }
h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--mute); margin: 32px 0 10px; display: flex; align-items: center; gap: 10px; }
.meta { color: var(--mute); font-size: 12px; font-family: var(--mono); }
.list { background: var(--card); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; padding: 12px 16px; border-top: 1px solid var(--line); align-items: center; }
.row:first-child { border-top: 0; }
.title { display: flex; align-items: center; gap: 10px; min-width: 0; flex-wrap: wrap; }
.title a.name { font-weight: 600; color: var(--fg); text-decoration: none; }
.title a.name:hover { color: var(--accent); }
.url { font-family: var(--mono); font-size: 12px; color: var(--accent); text-decoration: none; }
.url:hover { text-decoration: underline; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--off); flex: none; }
.dot.running { background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 20%, transparent); }
.dot.starting { background: var(--warn); animation: pulse 1s ease-in-out infinite; }
.dot.exited, .dot.down { background: var(--bad); }
@keyframes pulse { 50% { opacity: .35; } }
.badge { font-size: 11px; padding: 1px 7px; border-radius: 99px; border: 1px solid var(--line); color: var(--mute); }
.badge.stale { border-color: var(--warn); color: var(--warn); }
.sub { color: var(--mute); font-family: var(--mono); font-size: 12px; margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.actions { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
button { font: inherit; font-size: 12px; padding: 4px 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--card); color: var(--fg); cursor: pointer; }
button:hover { border-color: var(--mute); }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button.danger:hover { border-color: var(--bad); color: var(--bad); }
button:disabled { opacity: .5; cursor: default; }
.empty { padding: 24px 16px; color: var(--mute); }
pre, code { font-family: var(--mono); font-size: 12px; }
.empty pre { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; margin: 10px 0 0; overflow-x: auto; color: var(--fg); }
dialog { width: min(920px, calc(100vw - 32px)); border: 1px solid var(--line); border-radius: 10px; background: var(--card); color: var(--fg); padding: 0; }
dialog::backdrop { background: rgb(0 0 0 / .45); }
.dlg-head { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--line); gap: 8px; }
#logbody { margin: 0; padding: 12px 14px; height: min(65vh, 600px); overflow: auto; white-space: pre-wrap; word-break: break-all; background: var(--bg); }
.err { color: var(--bad); font-size: 12px; margin-left: auto; }
.group { margin-bottom: 24px; }
.group.hidden { display: none; }
.group h2 { margin-top: 0; }
.group h2 .count { font-weight: 400; letter-spacing: 0; }
.row.app { grid-template-columns: auto minmax(0, 1fr) auto; }
.dot.idle { background: transparent; box-shadow: inset 0 0 0 2px var(--off); }
.fav { width: 28px; height: 28px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); position: relative;
       display: grid; place-items: center; overflow: hidden; color: var(--mute); font-weight: 600; font-size: 13px; text-transform: uppercase; align-self: start; }
.fav img { position: absolute; inset: 3px; width: calc(100% - 6px); height: calc(100% - 6px); object-fit: contain; background: var(--bg); }
.since { color: var(--mute); font-size: 12px; }
button.copy { padding: 0 6px; font-size: 11px; color: var(--mute); }
button.armed { border-color: var(--bad); color: var(--bad); }
.found-name { font: inherit; font-family: var(--mono); font-size: 12px; padding: 3px 6px; width: 150px; border-radius: 6px;
              border: 1px solid var(--line); background: var(--bg); color: var(--fg); }
#toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); max-width: calc(100vw - 32px); background: var(--card);
         border: 1px solid var(--bad); color: var(--bad); padding: 8px 14px; border-radius: 8px; font-size: 13px;
         box-shadow: 0 6px 24px rgb(0 0 0 / .18); display: none; }
#toast.show { display: block; }
@media (max-width: 640px) {
  .row { grid-template-columns: 1fr; }
  .row.app { grid-template-columns: auto minmax(0, 1fr); }
  .row.app .actions { grid-column: 1 / -1; }
  .actions { justify-content: flex-start; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>localdev <span id="ver"></span></h1>
    <div class="meta" id="daemon"></div>
  </header>

  <div id="apps"><div class="list"><div class="empty">Loading…</div></div></div>

  <h2>Unregistered services <button id="scan">Scan now</button><span class="err" id="scanmsg"></span></h2>
  <div class="list" id="found"><div class="empty">Discovery is off. Press “Scan now” for a one-time scan, or start the daemon with <code>--discover</code>.</div></div>
</div>

<dialog id="logs">
  <div class="dlg-head"><strong id="logtitle"></strong><button id="logclose">Close</button></div>
  <pre id="logbody"></pre>
</dialog>

<div id="toast" role="alert"></div>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
let info = null, scanned = null;

async function api(method, path, body) {
  const res = await fetch(path, {
    method,
    headers: { "X-Localdev": "dashboard", ...(body ? { "Content-Type": "application/json" } : {}) },
    body: body ? JSON.stringify(body) : undefined,
  });
  const ct = res.headers.get("content-type") || "";
  const data = ct.includes("json") ? await res.json() : await res.text();
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

let toastTimer;
function toast(msg) {
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 6000);
}

function ago(iso) {
  const s = Math.max(0, (Date.now() - new Date(iso)) / 1000);
  if (s < 60) return "just now";
  const m = Math.floor(s / 60), h = Math.floor(m / 60), d = Math.floor(h / 24);
  return d ? `${d}d ${h % 24}h` : h ? `${h}h ${m % 60}m` : `${m}m`;
}

const rows = new Map();
const isUp = (a) => a.status === "running" || a.status === "starting";

function appInfo(a) {
  const managed = a.managed;
  const sub = managed ? `$ ${a.command}` : `proxy only → port ${a.port}`;
  const btns = [];
  if (managed) {
    if (isUp(a)) btns.push(`<button data-act="restart">Restart</button><button data-act="stop">Stop</button>`);
    else btns.push(`<button class="primary" data-act="start">Start</button>`);
    btns.push(`<button data-act="logs">Logs</button>`);
  }
  btns.push(`<button class="danger" data-act="remove">Remove</button>`);
  const stale = a.stale ? `<span class="badge stale" title="Definition changed since start; restart to apply">stale</span>` : "";
  const exit = a.status === "exited" ? ` (code ${esc(a.exit_code)})` : "";
  const tip = a.status === "idle" ? "Not running; the next request to its URL starts it" : a.status;
  const html = `<div class="title"><span class="dot ${esc(a.status)}" title="${esc(tip)}"></span>
      <a class="name" href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.name)}</a>
      <a class="url" href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.url)}</a>
      <button class="copy" data-act="copy" data-url="${esc(a.url)}" title="Copy URL">Copy</button>
      <span class="badge" title="${esc(tip)}">${esc(a.status)}${exit}</span><span class="badge">:${esc(a.port)}</span>${stale}
      <span class="since"></span></div>
    <div class="sub" title="${esc(sub)}">${esc(sub)}</div>
    ${a.cwd ? `<div class="sub" title="${esc(a.cwd)}">${esc(a.cwd)}</div>` : ""}`;
  return { html, actions: btns.join("") };
}

function since(a) {
  const parts = [];
  if (a.status === "running" && a.started_at) parts.push(`up ${ago(a.started_at)}`);
  if (a.status === "idle") parts.push("starts on next visit");
  if (a.last_request_at) {
    const t = ago(a.last_request_at);
    parts.push(`last request ${t === "just now" ? t : t + " ago"}`);
  }
  return parts.join(" · ");
}

// The favicon is only loaded for running apps: a request to an idle app would start it.
// It is rebuilt only when the app (re)starts, so the 2s refresh doesn't refetch it.
function updateFav(row, a) {
  const el = row.querySelector(".fav");
  const key = a.status === "running" ? `${a.url}|${a.started_at || ""}` : "letter";
  if (el.dataset.key === key) return;
  el.dataset.key = key;
  el.textContent = a.name[0];
  if (a.status !== "running") return;
  const img = new Image();
  img.alt = "";
  img.onerror = () => img.remove();
  img.src = `${a.url}/favicon.ico`;
  el.append(img);
}

function ensureGroups(el) {
  if (el.querySelector(".group")) return;
  rows.clear();
  el.innerHTML = [["up", "Running"], ["down", "Not running"]].map(([k, label]) =>
    `<section class="group" data-group="${k}"><h2>${label} <span class="count"></span></h2><div class="list"></div></section>`).join("");
}

function renderApps(apps) {
  const el = $("#apps");
  if (!apps.length) {
    rows.clear();
    el.innerHTML = `<div class="list"><div class="empty">No apps registered yet. From a project directory:
<pre>localdev run myapp -- npm run dev      # managed: localdev starts it and sets $PORT
localdev register myapp --port 3000    # proxy to a server you run yourself</pre></div></div>`;
    return;
  }
  ensureGroups(el);
  const names = new Set(apps.map((a) => a.name));
  for (const [name, row] of rows) if (!names.has(name)) { row.remove(); rows.delete(name); }
  for (const group of el.querySelectorAll(".group")) {
    const list = group.querySelector(".list");
    const items = apps.filter((a) => isUp(a) === (group.dataset.group === "up"));
    group.classList.toggle("hidden", !items.length);
    group.querySelector(".count").textContent = items.length ? `(${items.length})` : "";
    items.forEach((a, i) => {
      let row = rows.get(a.name);
      if (!row) {
        row = document.createElement("div");
        row.className = "row app";
        row.dataset.name = a.name;
        row.innerHTML = `<span class="fav"></span><div class="info"></div><div class="actions"></div>`;
        rows.set(a.name, row);
      }
      const { html, actions } = appInfo(a);
      const infoEl = row.querySelector(".info"), actEl = row.querySelector(".actions");
      if (infoEl.dataset.html !== html) { infoEl.innerHTML = html; infoEl.dataset.html = html; }
      if (actEl.dataset.html !== actions) { actEl.innerHTML = actions; actEl.dataset.html = actions; }
      infoEl.querySelector(".since").textContent = since(a);
      updateFav(row, a);
      if (list.children[i] !== row) list.insertBefore(row, list.children[i] || null);
    });
  }
}

function renderFound(list) {
  const el = $("#found");
  const items = list.filter((l) => l.http && !l.registered_as);
  const html = !items.length ? `<div class="empty">No unregistered HTTP services found.</div>` :
    items.map((l) => `<div class="row" data-port="${l.port}">
    <div><div class="title"><span class="dot running"></span><a class="name" href="http://localhost:${l.port}" target="_blank" rel="noopener">:${l.port}</a>
      <span class="badge">${esc(l.process || "unknown process")}</span>${l.pid ? `<span class="badge">pid ${l.pid}</span>` : ""}</div>
      ${l.cwd ? `<div class="sub">${esc(l.cwd)}</div>` : ""}${l.command ? `<div class="sub" title="${esc(l.command)}">${esc(l.command)}</div>` : ""}</div>
    <div class="actions"><input class="found-name" aria-label="App name" value="${esc(suggest(l))}" spellcheck="false">
      <button class="primary" data-act="adopt">Register</button></div></div>`).join("");
  // Re-rendering every refresh would wipe a name being typed, so only replace changed markup.
  if (el.dataset.html !== html) { el.innerHTML = html; el.dataset.html = html; }
}

function suggest(l) {
  const base = (l.cwd || "").split("/").filter(Boolean).pop() || l.process || "app";
  return base.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 63) || "app";
}

async function refresh() {
  try {
    if (!info) {
      info = await api("GET", "/api/health");
      $("#ver").textContent = "v" + info.version;
      $("#daemon").textContent = `${info.url} · pid ${info.pid}` + (info.idle_stop !== "off" ? ` · idle stop ${info.idle_stop}` : "");
    }
    renderApps(await api("GET", "/api/apps"));
    if (info.discover) renderFound(await api("GET", "/api/discover?cached=1"));
    else if (scanned) renderFound(scanned);
  } catch (e) {
    rows.clear();
    $("#apps").innerHTML = `<div class="list"><div class="empty">Cannot reach the localdev daemon: ${esc(e.message)}</div></div>`;
    info = null;
  }
}

// Remove asks for a second click instead of a confirm() dialog.
function armed(btn, label) {
  if (btn.classList.contains("armed")) return true;
  const orig = btn.textContent;
  btn.classList.add("armed");
  btn.textContent = label;
  setTimeout(() => { btn.classList.remove("armed"); btn.textContent = orig; }, 4000);
  return false;
}

$("#apps").addEventListener("click", async (ev) => {
  const btn = ev.target.closest("button[data-act]");
  if (!btn) return;
  const name = btn.closest(".row").dataset.name;
  const act = btn.dataset.act;
  if (act === "logs") return openLogs(name);
  if (act === "copy") {
    try {
      await navigator.clipboard.writeText(btn.dataset.url);
      btn.textContent = "Copied";
      setTimeout(() => { btn.textContent = "Copy"; }, 1500);
    } catch (e) { toast(`Could not copy: ${e.message}`); }
    return;
  }
  if (act === "remove" && !armed(btn, `Remove ${name}?`)) return;
  btn.disabled = true;
  try {
    if (act === "remove") await api("DELETE", `/api/apps/${name}`);
    else await api("POST", `/api/apps/${name}/${act}`);
  } catch (e) { toast(`${name}: ${e.message}`); btn.disabled = false; }
  refresh();
});

async function adopt(row) {
  const input = row.querySelector(".found-name");
  const name = input.value.trim();
  if (!name) return input.focus();
  try {
    await api("PUT", `/api/apps/${encodeURIComponent(name)}`, { port: Number(row.dataset.port) });
    scanned = scanned && scanned.map((l) => l.port == row.dataset.port ? { ...l, registered_as: name } : l);
  } catch (e) { toast(e.message); input.focus(); return; }
  refresh();
}
$("#found").addEventListener("click", (ev) => {
  const btn = ev.target.closest("button[data-act=adopt]");
  if (btn) adopt(btn.closest(".row"));
});
$("#found").addEventListener("keydown", (ev) => {
  if (ev.key === "Enter" && ev.target.matches(".found-name")) adopt(ev.target.closest(".row"));
});

$("#scan").addEventListener("click", async () => {
  $("#scan").disabled = true; $("#scanmsg").textContent = "";
  try { scanned = await api("GET", "/api/discover"); renderFound(scanned); }
  catch (e) { $("#scanmsg").textContent = e.message; }
  $("#scan").disabled = false;
});

// Logs stream from the daemon (tail -F style) for as long as the dialog is open.
let logCtl = null;
async function openLogs(name) {
  const body = $("#logbody");
  $("#logtitle").textContent = `${name} — output`;
  body.textContent = "";
  $("#logs").showModal();
  logCtl?.abort();
  const ctl = logCtl = new AbortController();
  let size = 0, first = true;
  const append = (text) => {
    const atBottom = first || body.scrollHeight - body.scrollTop - body.clientHeight < 40;
    first = false;
    body.append(text);
    size += text.length;
    if (size > 2e6) { body.textContent = body.textContent.slice(-1e6); size = 1e6; }
    if (atBottom) body.scrollTop = body.scrollHeight;
  };
  try {
    const res = await fetch(`/api/apps/${encodeURIComponent(name)}/logs?tail=500&follow=1`, { signal: ctl.signal });
    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || res.statusText);
    const reader = res.body.pipeThrough(new TextDecoderStream()).getReader();
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      append(value);
    }
  } catch (e) {
    if (e.name !== "AbortError") append(`\n[localdev: ${e.message}]\n`);
  }
}
$("#logclose").addEventListener("click", () => $("#logs").close());
$("#logs").addEventListener("close", () => { logCtl?.abort(); logCtl = null; });

refresh();
setInterval(refresh, 2000);
</script>
</body>
</html>

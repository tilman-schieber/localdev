name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - run: go test ./...
      - name: Build
        run: |
          set -euo pipefail
          mkdir dist
          # Archive names match `uname -s`_`uname -m` so install one-liners can compute them.
          for target in linux/amd64/Linux_x86_64 linux/arm64/Linux_aarch64 darwin/amd64/Darwin_x86_64 darwin/arm64/Darwin_arm64; do
            IFS=/ read -r goos goarch suffix <<<"$target"
            dir=$(mktemp -d)
            CGO_ENABLED=0 GOOS=$goos GOARCH=$goarch go build -trimpath \
              -ldflags "-s -w -X main.version=${GITHUB_REF_NAME#v}" -o "$dir/localdev" .
            cp LICENSE README.md "$dir/"
            tar -C "$dir" -czf "dist/localdev_${suffix}.tar.gz" localdev LICENSE README.md
          done
          (cd dist && sha256sum * > checksums.txt)
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
